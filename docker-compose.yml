services:
    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-self_healing}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
            POSTGRES_DB: ${POSTGRES_DB:-self_healing}
        ports:
            - "127.0.0.1:${DATABASE_HOST_PORT:-5433}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        environment:
            NODE_ENV: production
            PORT: 3000
            DATABASE_URL: postgresql://${POSTGRES_USER:-self_healing}:${POSTGRES_PASSWORD:-local_dev_password}@database:5432/${POSTGRES_DB:-self_healing}?schema=public
            MONITORED_CONTAINERS: ${MONITORED_CONTAINERS:-self-healing-demo-app}
            MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-5000}
            DOCKER_SOCKET_PATH: /var/run/docker.sock
            EVIDENCE_LOG_TAIL_LINES: ${EVIDENCE_LOG_TAIL_LINES:-100}
            EVIDENCE_LOG_MAX_BYTES: ${EVIDENCE_LOG_MAX_BYTES:-65536}
            EVIDENCE_COLLECTION_TIMEOUT_MS: ${EVIDENCE_COLLECTION_TIMEOUT_MS:-5000}
            CORS_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
        # Docker socket access is highly privileged. It is mounted only into the
        # backend because the monitoring worker needs to inspect allowlisted targets.
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        group_add:
            - "${DOCKER_GID:-129}"
        ports:
            - "${BACKEND_PORT:-3001}:3000"
        depends_on:
            database:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s
        restart: unless-stopped

    demo-app:
        build:
            context: ./demo-app
            dockerfile: Dockerfile
        container_name: self-healing-demo-app
        ports:
            - "${DEMO_APP_PORT:-4000}:4000"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    demo-app-2:
        build:
            context: ./demo-app
        container_name: self-healing-demo-app-2
        ports:
            - "4001:4000"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    demo-app-3:
        build:
            context: ./demo-app
        container_name: self-healing-demo-app-3
        ports:
            - "4002:4000"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    demo-app-4:
        build:
            context: ./demo-app
        container_name: self-healing-demo-app-4
        ports:
            - "4003:4000"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    demo-app-5:
        build:
            context: ./demo-app
        container_name: self-healing-demo-app-5
        ports:
            - "4004:4000"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-3001}
        ports:
            - "${FRONTEND_PORT:-5173}:80"
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q -O /dev/null http://127.0.0.1/ || exit 1",
                ]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

volumes:
    postgres_data:
